<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎰车队抽签小游戏</title>
<style>
*{box-sizing:border-box}
body{
margin:0;padding:20px;min-height:100vh;
font-family:"Microsoft YaHei";
background:radial-gradient(circle at top,#ffcc33,#8b0000 35%,#050505 80%);
text-align:center;color:white
}
.card{
max-width:450px;margin:auto;padding:25px;
background:rgba(255,255,255,.95);color:#222;
border-radius:35px;
box-shadow:0 20px 60px #000;
}
h1{color:#d35400;font-size:32px}
.name-area{margin-bottom:20px}
.nameBtn{
padding:12px 20px;margin:5px;
border:0;border-radius:25px;
font-size:18px;font-weight:bold;
background:#eee
}
.nameBtn.active{
background:linear-gradient(135deg,#ff512f,#dd2476);
color:white;transform:scale(1.1)
}
.machine{
display:flex;justify-content:center;gap:10px;
padding:18px;margin:20px auto;
background:#111;border:8px solid gold;
border-radius:30px;
box-shadow:0 0 30px gold
}
.column{
width:90px;height:120px;
overflow:hidden;
background:#fff;
border-radius:18px;
border:4px solid #333
}
.item{
height:120px;line-height:120px;
font-size:80px;font-weight:900;
font-family:Impact;
color:#ff9800;
text-shadow:4px 4px #8b4500
}
.stop{animation:bounce .2s}
@keyframes bounce{
50%{transform:translateY(12px)}
}
.draw{
padding:16px 45px;border:0;
border-radius:40px;
background:#00c853;color:white;
font-size:22px;font-weight:bold
}
.resultCard{
margin-top:25px;
padding:25px;
border-radius:25px;
background:linear-gradient(135deg,#fff3b0,#ffd700);
box-shadow:0 10px 30px #999;
animation:show .8s;
}
.big{
font-size:90px;
font-weight:900;
color:#b03a00;
text-shadow:4px 4px white
}
@keyframes show{
from{transform:scale(.3);opacity:0}
to{transform:scale(1);opacity:1}
}
#fireworks{
position:fixed;inset:0;
display:none;
font-size:70px;
padding-top:30vh;
pointer-events:none
}

.resultGif{
display:none;
width:100%;
max-width:420px;
height:auto;
margin:20px auto 0;
border-radius:25px;
box-shadow:0 0 40px gold;
animation:gifShow .8s;
}
@keyframes gifShow{
from{transform:scale(.2);opacity:0}
to{transform:scale(1);opacity:1}
}
</style>
</head>
<body>

<div id="fireworks">🎆✨🎇✨🎆</div>
<audio id="winAudio" preload="auto" src="audio/音效.mp3"></audio>
<img id="winGif" class="resultGif" src="img/中奖.gif">

<div class="card">
<h1>🎰 车队老虎机抽签</h1>
<p>选择你的名字，每人只能抽一次</p>

<div class="name-area" id="names"></div>

<div class="machine">
<div class="column"><div id="c1"></div></div>
<div class="column"><div id="c2"></div></div>
<div class="column"><div id="c3"></div></div>
</div>

<button class="draw" onclick="draw()">🎰 开始抽签</button>

<div id="result">等待抽签</div>
</div>

<script>
const people=["李子","橙子","蜜蜂","弦康","栀子","沐沐","潮生"];
const teams=["4","3"];
let current="";
let used={};

names.innerHTML=people.map(n=>`<button class="nameBtn" onclick="choose('${n}',this)">${n}</button>`).join("");

let ctx;
function sound(freq,duration=.1,vol=.12){
ctx ||= new AudioContext();
let o=ctx.createOscillator();
let g=ctx.createGain();
o.type="square";
o.frequency.value=freq;
g.gain.value=vol;
o.connect(g);g.connect(ctx.destination);
o.start();
g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
o.stop(ctx.currentTime+duration);
}

function choose(n,b){
current=n;
sound(700,.1,.15);
document.querySelectorAll(".nameBtn").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
}

function spin(id,time,result){
let e=document.getElementById(id);
let t=setInterval(()=>{
e.innerHTML=teams[Math.floor(Math.random()*2)];
sound(180+Math.random()*120,.04,.08);
},80);

setTimeout(()=>{
clearInterval(t);
e.innerHTML=result;
e.classList.add("stop");
sound(120,.12,.2);
},time);
}

function draw(){
if(!current)return alert("请选择名字");
if(used[current])return alert("你已经抽过了");

let name=current;
let result=Math.random()>0.5?"4":"3";
sound(600,.2,.25);

spin("c1",1400,result);
spin("c2",2100,result);
spin("c3",2800,result);

setTimeout(()=>{
used[name]=result;

document.getElementById("result").innerHTML=
`<div class="resultCard">
<h2>🎉 抽签完成</h2>
<div>${name}</div>
<div class="big">${result}</div>
<h2>${result==="4"?"四人车队":"三人车队"}</h2>
<p>🏎️ 欢迎加入你的车队</p>
</div>`;

let f=document.getElementById("fireworks");
f.style.display="block";
sound(1200,.8,.3);

// 播放专属动图和用户提供音效
let gif=document.getElementById("winGif");
let audio=document.getElementById("winAudio");
gif.style.display="block";
audio.currentTime=0;
audio.play().catch(()=>{});

setTimeout(()=>f.style.display="none",2500);

document.querySelectorAll(".nameBtn").forEach(b=>{
if(b.innerText===name)b.disabled=true;
});
},3000);

current="";
}
</script>
</body>
</html>
